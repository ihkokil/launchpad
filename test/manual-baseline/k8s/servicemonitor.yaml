apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: manual-orders-api
  namespace: default
  labels:
    app.kubernetes.io/name: manual-orders-api
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: manual-orders-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
