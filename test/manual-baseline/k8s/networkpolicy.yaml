apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manual-orders-api-netpol
  namespace: default
  labels:
    app.kubernetes.io/name: manual-orders-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: manual-orders-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53

