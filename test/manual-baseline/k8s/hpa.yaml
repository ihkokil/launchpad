apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manual-orders-api-hpa
  namespace: default
  labels:
    app.kubernetes.io/name: manual-orders-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: manual-orders-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

