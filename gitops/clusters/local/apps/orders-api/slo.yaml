apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: orders-api-slo
  namespace: default
  labels:
    platform.launchpad.io/owner: team-checkout
    platform.launchpad.io/tier: standard
spec:
  service: orders-api
  labels:
    owner: team-checkout
    tier: standard
  slos:
    - name: availability
      objective: 99.9
      description: "99.9% of HTTP requests respond with non-5xx status codes over a 30-day rolling window."
      sli:
        events:
          error_query: sum(rate(http_requests_total{job="orders-api",status=~"5.."}[{{.window}}]))
          total_query: sum(rate(http_requests_total{job="orders-api"}[{{.window}}]))
      alerting:
        name: orders-api-HighErrorRate
        labels:
          severity: page
          team: team-checkout
        annotations:
          summary: "High error budget burn rate on orders-api"
          runbook_url: "https://runbooks.launchpad.io/services/orders-api/availability"
          dashboard_url: "http://localhost:3000/d/launchpad-slo/orders-api"
        page_alert:
          labels:
            severity: page
        ticket_alert:
          labels:
            severity: warning
    - name: latency-p95
      objective: 99.0
      description: "95th percentile latency must remain below 250ms."
      sli:
        events:
          error_query: sum(rate(http_request_duration_seconds_bucket{job="orders-api",le=~"0.[0-9]+"}[{{.window}}])) - sum(rate(http_request_duration_seconds_bucket{job="orders-api",le="0.25"}[{{.window}}]))
          total_query: sum(rate(http_request_duration_seconds_count{job="orders-api"}[{{.window}}]))
      alerting:
        name: orders-api-HighLatency
        labels:
          severity: warning
          team: team-checkout
        annotations:
          summary: "p95 latency exceeded threshold of 250ms on orders-api"
          runbook_url: "https://runbooks.launchpad.io/services/orders-api/latency"
