apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orders-api
  namespace: default
  labels:
    platform.launchpad.io/managed-by: launchpad-cli
    platform.launchpad.io/owner: team-checkout
    platform.launchpad.io/tier: standard
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    owner: team-checkout
    tier: standard
    replicaCount: 2
    image:
      repository: orders-api
      tag: "v0.1.0"
    service:
      port: 8080
      targetPort: 8080
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      NODE_ENV: "production"
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
    pdb:
      enabled: true
      minAvailable: 1
